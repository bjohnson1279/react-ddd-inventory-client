name: React Client CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Merge Conflict Markers
        run: |
          echo "Scanning codebase for git merge conflict markers..."
          if git grep -n -I -E '^(<{7}|={7}|>{7}|\|{7})([[:space:]]|$)'; then
            echo "::error::Merge conflict markers detected in tracked files! Please resolve conflicts before merging."
            exit 1
          fi
          echo "No conflict markers detected."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build / Compile Check
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm run test:unit

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
